<script>
/* ================================================================
   AOS(스크롤 등장 효과) 공통 설정 — 값은 이 파일 한 곳에서만 조정한다.
   footer.html 끝에서 include 되어 모든 사이트 페이지에 자동 적용된다.
   (첫 페인트 전에 속성을 부여해 깜빡임이 없도록 인라인으로 둔다)
   - 제외: 섹션이나 요소에 data-aos-off 속성을 달면 그 안은 효과가 붙지 않는다.
   - 동작 줄이기(prefers-reduced-motion) 환경에서는 전부 끈다.
   ================================================================ */
window.XI_AOS = {
  offset: 80,               // 화면 하단에서 80px 들어오면 시작
  duration: 700,            // ms
  easing: 'ease-out-cubic',
  once: true,               // 한 번 나타나면 반복하지 않음
  distance: 24,             // 아래 → 위 이동 거리(px)
  sectionDelay: 100,        // 섹션 안 두 번째 요소부터 지연(ms)
  cardDelay: 100,           // 카드 간 지연(ms)
  cardDelayMax: 3,          // 지연이 붙는 카드는 3번째까지
  intro: { distance: 16, duration: 800, delay: 150 },   // 첫 화면(히어로·서브비주얼) 로드 등장
  exclude: '[data-aos-off]',
  intros: '.hero__inner > *, .hero__facts, .subvisual__inner > *, .apply-hero__inner > *',
  sections: 'main > section:not(.hero):not(.subvisual):not(.apply-hero)',
  // 전폭 배경형 비주얼은 이동 없이 페이드만
  fadeOnly: '.exterior__visual, .landmark__visual',
  // 카드처럼 가로로 나란한 묶음 → 자식이 왼쪽부터 순서대로 등장
  cards: '.menu-cards, .photo-strip, .gallery, .arch__gardens, .sys-grid, .overview',
  // 비주얼 + 콘텐츠 블록
  blocks: [
    '.exterior__visual', '.landmark__visual', 'figure', '.media', '.sys-card', '.unit-intro__circles', '.checker',
    '.sec-head', '.spaced-title', '.feature', '.facility-list', '.landscape-list', '.arch__point', '.arch__summary',
    '.spec-list', '.unit-intro__h', '.option-box', '.notice__acc', '.landmark__pins', '.sys-lead', '.tabs', '#unitPanels',
    '.brand-story__inner > *', '.cta-band__inner > *', '.apply-aside__card', '.apply-main'
  ].join(', ')
};
(function (c) {
  var root = document.documentElement;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { root.classList.add('aos-off'); return; }
  root.classList.add('aos-on');
  root.style.setProperty('--aos-distance', c.distance + 'px');
  root.style.setProperty('--intro-distance', c.intro.distance + 'px');
  root.style.setProperty('--intro-duration', c.intro.duration + 'ms');

  // 1) 첫 화면: 스크롤 대신 로드 시 등장
  var n = 0;
  document.querySelectorAll(c.intros).forEach(function (el) {
    if (el.closest(c.exclude)) return;
    el.classList.add('xi-intro');
    el.style.setProperty('--intro-delay', (n++ ? c.intro.delay : 0) + 'ms');
  });

  // 2) 섹션 콘텐츠 · 비주얼
  var set = function (el, delay) {
    el.setAttribute('data-aos', el.matches(c.fadeOnly) ? 'fade' : 'fade-up');
    if (delay) el.setAttribute('data-aos-delay', String(delay));
  };
  document.querySelectorAll(c.sections).forEach(function (sec) {
    if (sec.closest(c.exclude)) return;
    var handled = [];
    var inHandled = function (el) { for (var i = 0; i < handled.length; i++) if (handled[i].contains(el)) return true; return false; };
    var count = 0;
    sec.querySelectorAll(c.cards + ', ' + c.blocks).forEach(function (el) {
      if (el.closest(c.exclude) || inHandled(el)) return;
      var base = count++ ? c.sectionDelay : 0;
      if (el.matches(c.cards)) {
        var kids = Array.prototype.filter.call(el.children, function (k) { return !k.matches(c.exclude); });
        kids.forEach(function (k, i) { set(k, base + Math.min(i, c.cardDelayMax - 1) * c.cardDelay); });
      } else {
        set(el, base);
      }
      handled.push(el);
    });
  });
})(window.XI_AOS);
</script>
