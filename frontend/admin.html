<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 | 백석시그니처자이</title>
  <link rel="stylesheet" href="/src/styles/admin-entry.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
</head>
<body class="admin-body">
  <!-- 로그인 -->
  <section class="login" id="loginView" hidden>
    <div class="login__pattern" aria-hidden="true"></div>
    <form class="login__card" id="loginForm">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true"><i>Xi</i></span><span class="brand__divider" aria-hidden="true"></span><span class="brand__name">백석시그니처자이</span></a>
      <h1>관리자 로그인</h1>
      <p class="login__desc">관리자 비밀번호를 입력해 주세요.</p>
      <div class="field">
        <label class="field__label" for="password">비밀번호</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="field__error" id="loginError" role="alert"></p>
      <button class="btn btn--block btn--lg" type="submit">로그인</button>
      <a class="login__back" href="/">← 사이트로 돌아가기</a>
    </form>
  </section>

  <!-- 대시보드 -->
  <div class="admin" id="adminView" hidden>
    <header class="admin-top">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true"><i>Xi</i></span><span class="brand__divider" aria-hidden="true"></span><span class="brand__name">백석시그니처자이 <small>ADMIN</small></span></a>
      <div class="admin-top__actions">
        <a class="btn btn--ghost btn--sm" href="/?edit=1">사이트 화면 편집</a>
        <a class="btn btn--ghost btn--sm" href="/apply.html" target="_blank" rel="noopener">신청 화면 보기</a>
        <button class="btn btn--light btn--sm" type="button" id="logoutBtn">로그아웃</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-head">
        <div>
          <p class="kicker">Applications</p>
          <h1>관심고객 신청 관리</h1>
        </div>
      </div>

      <section class="stats" id="stats" aria-label="상태별 현황"></section>

      <section class="panel closing" aria-labelledby="closingTitle">
        <div class="closing__row">
          <div>
            <h2 id="closingTitle">신청 마감 설정</h2>
            <p class="panel__desc">마감하면 신청 화면에는 안내 문구만 표시되고, 서버도 새 신청을 거부합니다.</p>
          </div>
          <label class="switch"><input type="checkbox" id="closeSwitch" /> <span id="closeState">접수중</span></label>
        </div>
        <div class="closing__fields">
          <div class="field"><label class="field__label" for="closedTitle">마감 안내 제목</label><input class="input" id="closedTitle" maxlength="100" /></div>
          <div class="field"><label class="field__label" for="closedMessage">마감 안내 문구</label><textarea class="textarea" id="closedMessage" maxlength="1000" rows="3"></textarea></div>
          <div><button class="btn btn--outline btn--sm" type="button" id="saveClosedText">안내 문구 저장</button></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="listTitle">
        <h2 id="listTitle" class="sr-only">신청 목록</h2>
        <form class="filters" id="filterForm">
          <div class="field filters__q"><label class="field__label" for="q">검색</label><input class="input" id="q" name="q" placeholder="이름, 연락처, 문의내용, 메모" /></div>
          <div class="field filters__sel"><label class="field__label" for="status">상태</label><select class="select" id="status" name="status"><option value="">전체</option></select></div>
          <div class="field filters__sel"><label class="field__label" for="unitType">타입</label><select class="select" id="unitType" name="unitType"><option value="">전체</option></select></div>
          <div class="field filters__period">
            <span class="field__label" id="periodLabel">신청 기간</span>
            <div class="period" role="group" aria-labelledby="periodLabel">
              <input class="input" type="date" name="from" aria-label="시작일" />
              <span aria-hidden="true">~</span>
              <input class="input" type="date" name="to" aria-label="종료일" />
            </div>
          </div>
          <div class="filters__actions">
            <button class="btn btn--sm" type="submit">조회</button>
            <button class="btn btn--outline btn--sm" type="reset">초기화</button>
          </div>
        </form>

        <div class="list-toolbar">
          <div class="list-toolbar__left">
            <p class="list-toolbar__count" id="resultCount" aria-live="polite"></p>
            <div class="quick" id="quickRange" role="group" aria-label="빠른 기간 선택">
              <button type="button" data-range="0">오늘</button>
              <button type="button" data-range="7">7일</button>
              <button type="button" data-range="30">30일</button>
              <button type="button" data-range="all">전체</button>
            </div>
          </div>
          <div class="list-toolbar__actions">
            <button class="btn btn--danger btn--sm" type="button" id="bulkDelete" disabled>선택 삭제</button>
            <a class="btn btn--outline btn--sm" id="csvBtn" href="/api/admin/applications.csv">CSV 다운로드</a>
            <select class="select select--sm" id="pageSize" aria-label="페이지당 개수"><option>20</option><option>50</option><option>100</option></select>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table admin-table">
            <thead>
              <tr>
                <th scope="col"><input type="checkbox" id="checkAll" aria-label="현재 페이지 전체 선택" /></th>
                <th scope="col">번호</th>
                <th scope="col">신청일시</th>
                <th scope="col">이름</th>
                <th scope="col">연락처</th>
                <th scope="col">관심타입</th>
                <th scope="col">방문희망일</th>
                <th scope="col">문의 / 메모</th>
                <th scope="col">마케팅</th>
                <th scope="col">상태</th>
                <th scope="col">관리</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="pager" id="pager" aria-label="페이지 이동"></nav>
      </section>
    </main>
  </div>

  <div class="modal" id="memoModal" role="dialog" aria-modal="true" aria-labelledby="memoTitle">
    <form class="modal__panel" id="memoForm">
      <button class="modal__close" type="button" aria-label="닫기" data-close>×</button>
      <h2 id="memoTitle" class="modal-title">신청 상세</h2>
      <dl class="detail" id="memoDetail"></dl>
      <div class="field"><label class="field__label" for="memoText">관리자 메모</label><textarea class="textarea" id="memoText" maxlength="1000"></textarea></div>
      <div class="modal__actions"><button class="btn btn--outline btn--sm" type="button" data-close>닫기</button><button class="btn btn--sm" type="submit">메모 저장</button></div>
    </form>
  </div>

  <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
